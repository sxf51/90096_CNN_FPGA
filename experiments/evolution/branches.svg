<text x="40" y="105.0" font-size="15" font-weight="400" fill="#435654">Condensed from 231 registered experiments (results.csv). Only turning points are drawn; every ID links to experiments/&lt;ID&gt;_*/. Numbers are ms/frame; the evidence level is stated on each node.</text>
<text x="40" y="130.5" font-size="14" font-weight="400" fill="#526461">Metric: ms/frame = cycles x clock period. HLS = HLS estimated cycles x target clock; RTL x routed = C/RTL co-simulation cycles x an independently closed post-route clock. No value is a board measurement.</text>
<text x="40" y="155.5" font-size="14" font-weight="400" fill="#526461">Solid: baseline or parameter evolution, retry after fix, integration of an existing module; dashed: numerical evidence or inspiration, control, verification of the same design, replay. Edges are design</text>
<text x="40" y="176.5" font-size="14" font-weight="400" fill="#526461">lineage, not Git history.</text>
