<title>SRCNN on KV260: experiment evolution：Phase 2: architecture branches (packing, Winograd, scatter, tiling, DDR, combination)</title>
<desc>Condensed from 231 registered experiments (results.csv). Only turning points are drawn; every ID links to experiments/&lt;ID&gt;_*/. Numbers are ms/frame; the evidence level is stated on each node.. Generated by evolution_graph.cjs from graph.json; do not edit by hand.</desc>
