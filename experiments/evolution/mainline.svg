<text x="40" y="38.0" font-size="24" font-weight="700" fill="#182c2d">SRCNN on KV260: experiment evolution：Phase 2:</text>
<text x="40" y="74.0" font-size="24" font-weight="700" fill="#182c2d">continuous direct-convolution mainline</text>
<text x="40" y="105.0" font-size="15" font-weight="400" fill="#435654">Condensed from 231 registered experiments (results.csv). Only turning points are</text>
<text x="40" y="127.5" font-size="15" font-weight="400" fill="#435654">drawn; every ID links to experiments/&lt;ID&gt;_*/. Numbers are ms/frame; the evidence level</text>
<text x="40" y="150.0" font-size="15" font-weight="400" fill="#435654">is stated on each node.</text>
<text x="40" y="175.5" font-size="14" font-weight="400" fill="#526461">Metric: ms/frame = cycles x clock period. HLS = HLS estimated cycles x target clock; RTL x</text>
<text x="40" y="196.5" font-size="14" font-weight="400" fill="#526461">routed = C/RTL co-simulation cycles x an independently closed post-route clock. No value is</text>
<text x="40" y="217.5" font-size="14" font-weight="400" fill="#526461">a board measurement.</text>
<text x="40" y="242.5" font-size="14" font-weight="400" fill="#526461">Solid: baseline or parameter evolution, retry after fix, integration of an existing module;</text>
<text x="40" y="263.5" font-size="14" font-weight="400" fill="#526461">dashed: numerical evidence or inspiration, control, verification of the same design, replay.</text>
<text x="40" y="284.5" font-size="14" font-weight="400" fill="#526461">Edges are design lineage, not Git history.</text>
