<text x="40" y="117.0" font-size="14" font-weight="400" fill="#526461">Metric: ms/frame = cycles x clock period. HLS = HLS estimated cycles x target clock; RTL x routed = C/RTL co-simulation cycles x an independently</text>
<text x="40" y="138.0" font-size="14" font-weight="400" fill="#526461">closed post-route clock. No value is a board measurement.</text>
<text x="40" y="163.0" font-size="14" font-weight="400" fill="#526461">Solid: baseline or parameter evolution, retry after fix, integration of an existing module; dashed: numerical evidence or inspiration, control,</text>
