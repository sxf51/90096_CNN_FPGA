syn.cflags=-std=c++14 -ffp-contract=off -DEXP_ALL_CONTINUOUS=1 -DEXP_A_BITS=10 -DEXP_FRAMES=2 -DEXP_ONLINE_PAD=1 -DEXP_STORAGE=1 -DEXP_T=4 -DEXP_W_BITS=10 -DEXP_FIXED=1 -DEXP_SET14=1 -DEXP_REFERENCE=1 -DEXP_NUMPY_REFERENCE=1 -DEXP_QUICK=1 -Isrc
tb.cflags=-std=c++14 -ffp-contract=off -DEXP_ALL_CONTINUOUS=1 -DEXP_A_BITS=10 -DEXP_FRAMES=2 -DEXP_ONLINE_PAD=1 -DEXP_STORAGE=1 -DEXP_T=4 -DEXP_W_BITS=10 -DEXP_FIXED=1 -DEXP_SET14=1 -DEXP_REFERENCE=1 -DEXP_NUMPY_REFERENCE=1 -DEXP_QUICK=1 -Isrc
syn.file=src/conv1.cpp
syn.file=src/srcnn.cpp
