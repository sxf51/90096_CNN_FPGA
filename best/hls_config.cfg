# C17 (designs/winograd_t4_windows32_v1) C simulation + HLS synthesis.
# Reconstructed from results/C17_hls/hls_config.cfg with paths relative to this folder.
# Run from this folder: see run_hls.sh.
part=xck26-sfvc784-2LV-c
