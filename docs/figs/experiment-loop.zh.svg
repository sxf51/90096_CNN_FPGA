<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>实验循环</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f7f7c"/></marker></defs>
<rect width="1120" height="560" fill="#ffffff"/>
<rect x="40" y="50" width="310" height="112" rx="6" fill="#fdf3e3" stroke="#b07a1f" stroke-width="1.6"/>
<text x="56" y="78" font-size="16" font-weight="700" fill="#1f2d2c">人：高层计划</text>
<text x="56" y="98" font-size="13" fill="#40514f">不变的契约、唯一主指标、</text>
<text x="56" y="118" font-size="13" fill="#40514f">三道门槛、要探索的方向</text>
<rect x="405" y="50" width="310" height="112" rx="6" fill="#e9f1f8" stroke="#3c6e9c" stroke-width="1.6"/>
<text x="421" y="78" font-size="16" font-weight="700" fill="#1f2d2c">agent：实验卡</text>
<text x="421" y="98" font-size="13" fill="#40514f">瓶颈证据、一个假设、一个对照、</text>
<text x="421" y="118" font-size="13" fill="#40514f">唯一改动、纸面估计；</text>
<text x="421" y="138" font-size="13" fill="#40514f">任何运行之前先提交到 Git</text>
<rect x="770" y="50" width="310" height="112" rx="6" fill="#f3f4f4" stroke="#6f7f7c" stroke-width="1.6"/>
<text x="786" y="78" font-size="16" font-weight="700" fill="#1f2d2c">通过 SSH 运行</text>
<text x="786" y="98" font-size="13" fill="#40514f">C 仿真 → HLS 综合 →</text>
<text x="786" y="118" font-size="13" fill="#40514f">C/RTL 协同仿真 → 布局布线；</text>
<text x="786" y="138" font-size="13" fill="#40514f">带超时，一次一个重任务</text>
<rect x="770" y="300" width="310" height="112" rx="6" fill="#e9f1f8" stroke="#3c6e9c" stroke-width="1.6"/>
<text x="786" y="328" font-size="16" font-weight="700" fill="#1f2d2c">归档与注册表</text>
<text x="786" y="348" font-size="13" fill="#40514f">原始报告、解析指标、</text>
<text x="786" y="368" font-size="13" fill="#40514f">解读、证据等级；</text>
<text x="786" y="388" font-size="13" fill="#40514f">失败同样归档</text>
<rect x="40" y="300" width="310" height="112" rx="6" fill="#fdf3e3" stroke="#b07a1f" stroke-width="1.6"/>
<text x="56" y="328" font-size="16" font-weight="700" fill="#1f2d2c">人工审阅</text>
<text x="56" y="348" font-size="13" fill="#40514f">每 10 到 20 个实验：</text>
<text x="56" y="368" font-size="13" fill="#40514f">读解读、发布新计划、</text>
<text x="56" y="388" font-size="13" fill="#40514f">按校准证据修改门槛</text>
<rect x="770" y="462" width="310" height="64" rx="6" fill="#e9f1f8" stroke="#3c6e9c" stroke-width="1.6"/>
<text x="786" y="490" font-size="16" font-weight="700" fill="#1f2d2c">演化图</text>
<text x="786" y="510" font-size="13" fill="#40514f">graph.json → SVG，每个实验一个节点</text>
<path d="M560 300 L675 356 L560 412 L445 356 Z" fill="#ffffff" stroke="#1f2d2c" stroke-width="1.8"/>
<text x="560" y="352" font-size="16" font-weight="700" fill="#1f2d2c" text-anchor="middle">门槛</text>
<text x="560" y="372" font-size="13" fill="#40514f" text-anchor="middle">质量 / 筛选 / 最终</text>
<path d="M350 106 L405 106" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M715 106 L770 106" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M925 162 L925 300" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M770 356 L675 356" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M560 300 L560 162" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570" y="240" font-size="12.5" fill="#40514f" text-anchor="start">通过筛选：下一张卡片</text>
<path d="M445 356 L350 356" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="397" y="345" font-size="12.5" fill="#40514f" text-anchor="middle">一批结果</text>
<path d="M195 300 L195 162" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205" y="240" font-size="12.5" fill="#40514f" text-anchor="start">新计划、新门槛</text>
<path d="M925 412 L925 462" fill="none" stroke="#6f7f7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560" y="434" font-size="12.5" fill="#40514f" text-anchor="middle">未通过：保留节点，记录原因</text>
<rect x="40" y="524" width="16" height="12" rx="2" fill="#fdf3e3" stroke="#b07a1f"/>
<text x="62" y="535" font-size="12.5" fill="#40514f">人</text>
<rect x="88" y="524" width="16" height="12" rx="2" fill="#e9f1f8" stroke="#3c6e9c"/>
<text x="110" y="535" font-size="12.5" fill="#40514f">agent</text>
<rect x="168" y="524" width="16" height="12" rx="2" fill="#f3f4f4" stroke="#6f7f7c"/>
<text x="190" y="535" font-size="12.5" fill="#40514f">工具</text>
</svg>
