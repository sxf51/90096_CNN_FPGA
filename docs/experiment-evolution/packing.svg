<g data-id="P14">
<rect x="2834.00" y="761.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="2858.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P14</text>
<text x="2858.00" y="819.50" font-size="20" font-weight="700" fill="#243031">INT16 拆肢 Packing</text>
<text x="2858.00" y="855.50" font-size="16" font-weight="400" fill="#243031">拆分十六位操作数，组合小位宽打包乘积，</text>
