<rect x="3431.00" y="1406.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="3455.00" y="1433.00" font-size="17" font-weight="700" fill="#243031">P12</text>
<text x="3455.00" y="1464.50" font-size="20" font-weight="700" fill="#243031">精确十位 Packing 整网 T4</text>
<text x="3455.00" y="1500.50" font-size="16" font-weight="400" fill="#243031">进一步提高并行度，比较时间与资源的取舍</text>
