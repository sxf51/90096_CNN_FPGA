<g data-id="P15">
<rect x="3232.00" y="746.00" width="354" height="249" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="3256.00" y="773.00" font-size="17" font-weight="700" fill="#243031">P15</text>
<text x="3256.00" y="804.50" font-size="20" font-weight="700" fill="#243031">INT16 重叠字段与 fabric 修</text>
