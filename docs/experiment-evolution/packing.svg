<g data-id="P01">
<rect x="1451.00" y="431.00" width="354" height="219" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="1475.00" y="458.00" font-size="17" font-weight="700" fill="#243031">P01</text>
<text x="1475.00" y="489.50" font-size="20" font-weight="700" fill="#243031">共享输入的双 INT8 乘法</text>
<text x="1475.00" y="525.50" font-size="16" font-weight="400" fill="#243031">以 gap18 拼接两个系数，修正低字段为</text>
<text x="1475.00" y="549.50" font-size="16" font-weight="400" fill="#243031">负时的借位；穷举 signed8 三元组。</text>
<text x="1475.00" y="579.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 132</text>
<text x="1475.00" y="609.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P02">
<rect x="48.00" y="773.00" width="354" height="195" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="72.00" y="800.00" font-size="17" font-weight="700" fill="#243031">P02</text>
<text x="72.00" y="831.50" font-size="20" font-weight="700" fill="#243031">两路直接乘法控制</text>
<text x="72.00" y="867.50" font-size="16" font-weight="400" fill="#243031">相同接口和输入，分别计算两个乘积。</text>
<text x="72.00" y="897.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 2 / LUT 57</text>
<text x="72.00" y="927.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
</g>
<g data-id="P03">
<rect x="446.00" y="761.00" width="354" height="219" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="470.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P03</text>
<text x="470.00" y="819.50" font-size="20" font-weight="700" fill="#243031">七项后再拆包</text>
<text x="470.00" y="855.50" font-size="16" font-weight="400" fill="#243031">在 signed8 安全界内累加七个打包乘积</text>
<text x="470.00" y="879.50" font-size="16" font-weight="400" fill="#243031">，再解码。</text>
<text x="470.00" y="909.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 299</text>
<text x="470.00" y="939.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P04">
<rect x="844.00" y="761.00" width="354" height="219" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="868.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P04</text>
<text x="868.00" y="819.50" font-size="20" font-weight="700" fill="#243031">自动识别 Packing 表达式</text>
<text x="868.00" y="855.50" font-size="16" font-weight="400" fill="#243031">去掉显式 DSP 绑定，观察编译器是否识</text>
<text x="868.00" y="879.50" font-size="16" font-weight="400" fill="#243031">别表达式。</text>
<text x="868.00" y="909.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 132</text>
<text x="868.00" y="939.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P05">
<rect x="1242.00" y="761.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="1266.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P05</text>
<text x="1266.00" y="819.50" font-size="20" font-weight="700" fill="#243031">DSP pre-adder builtin</text>
<text x="1266.00" y="855.50" font-size="16" font-weight="400" fill="#243031">使用 SDK 的 DSP48E2 builtin 显式</text>
<text x="1266.00" y="879.50" font-size="16" font-weight="400" fill="#243031">表达预加和流水级。</text>
<text x="1266.00" y="909.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 127</text>
<text x="1266.00" y="939.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
</g>
<g data-id="P06">
<rect x="1640.00" y="761.00" width="354" height="219" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="1664.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P06</text>
<text x="1664.00" y="819.50" font-size="20" font-weight="700" fill="#243031">非负十位激活，两项拆包</text>
<text x="1664.00" y="855.50" font-size="16" font-weight="400" fill="#243031">共享激活范围 0..511 时，低字段最多安</text>
<text x="1664.00" y="879.50" font-size="16" font-weight="400" fill="#243031">全累加两项。</text>
<text x="1664.00" y="909.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 274</text>
<text x="1664.00" y="939.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P07">
<rect x="2436.00" y="761.00" width="354" height="219" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="2460.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P07</text>
<text x="2460.00" y="819.50" font-size="20" font-weight="700" fill="#243031">精确十位系数残差修复</text>
<text x="2460.00" y="855.50" font-size="16" font-weight="400" fill="#243031">系数拆成低八位与 256 倍残差，在</text>
<text x="2460.00" y="879.50" font-size="16" font-weight="400" fill="#243031">fabric 中精确恢复。</text>
<text x="2460.00" y="909.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 454</text>
<text x="2460.00" y="939.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P08">
<rect x="1242.00" y="1091.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="1266.00" y="1118.00" font-size="17" font-weight="700" fill="#243031">P08</text>
<text x="1266.00" y="1149.50" font-size="20" font-weight="700" fill="#243031">检查实际 DSP pre-adder</text>
<text x="1266.00" y="1185.50" font-size="16" font-weight="400" fill="#243031">Vivado 实现后检查 DSP48E2 的</text>
<text x="1266.00" y="1209.50" font-size="16" font-weight="400" fill="#243031">AMULTSEL、ADREG 等属性。</text>
<text x="1266.00" y="1239.50" font-size="16" font-weight="700" fill="#243031">Routed WNS 2.805 ns</text>
<text x="1266.00" y="1269.50" font-size="15" font-weight="400" fill="#5c6160">实现完成，另看时序</text>
</g>
<g data-id="P09">
<rect x="2038.00" y="761.00" width="354" height="219" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="2062.00" y="788.00" font-size="17" font-weight="700" fill="#243031">P09</text>
<text x="2062.00" y="819.50" font-size="20" font-weight="700" fill="#243031">冻结记录复现</text>
