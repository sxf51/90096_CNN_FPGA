<svg xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" width="4430" height="1691" viewBox="0 0 4430 1691">
<title>A：Packing，从局部精确性到整网成本</title>
<desc>一个 DSP 做两个共享操作数乘法，省下的 DSP 是否抵得过修复逻辑？。数据快照 653ceb9。实验关系不是 Git 提交历史。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#778482"/></marker></defs>
<rect x="0" y="0" width="4430" height="1691" fill="#ffffff"/>
<text x="48" y="43" font-size="27" font-weight="700" fill="#182c2d">A：Packing，从局部精确性到整网成本</text>
<text x="48" y="76" font-size="17" fill="#435654">一个 DSP 做两个共享操作数乘法，省下的 DSP 是否抵得过修复逻辑？</text>
<text x="48" y="105" font-size="16" fill="#526461">实线：基线、修复、集成；虚线：数值依据、对照、同一设计验证、复现。</text>
<text x="48" y="133" font-size="16" fill="#526461">绿：阶段证据通过；红：超预算或失败；琥珀：时序待处理；虚边：仅计划；灰：外部来源。</text>
