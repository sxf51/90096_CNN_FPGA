<text x="3256.00" y="870.50" font-size="16" font-weight="400" fill="#243031">允许字段重叠，再用精确 fabric 算术恢</text>
<text x="3256.00" y="894.50" font-size="16" font-weight="400" fill="#243031">复两路完整乘积。</text>
<text x="3256.00" y="924.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 747</text>
<text x="3256.00" y="954.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P16">
<rect x="3630.00" y="746.00" width="354" height="249" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="3654.00" y="773.00" font-size="17" font-weight="700" fill="#243031">P16</text>
<text x="3654.00" y="804.50" font-size="20" font-weight="700" fill="#243031">INT16 一 DSP 加一 fabric</text>
<text x="3654.00" y="834.50" font-size="20" font-weight="700" fill="#243031">控制</text>
<text x="3654.00" y="870.50" font-size="16" font-weight="400" fill="#243031">直接把一条乘法放在 DSP、一条放在 LUT</text>
<text x="3654.00" y="894.50" font-size="16" font-weight="400" fill="#243031">，匹配 P15 的资源类型。</text>
<text x="3654.00" y="924.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 330</text>
<text x="3654.00" y="954.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
