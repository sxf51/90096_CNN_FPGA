<text x="2062.00" y="879.50" font-size="16" font-weight="400" fill="#243031">验证复现机制。</text>
<text x="2062.00" y="909.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 1 / LUT 132</text>
<text x="2062.00" y="939.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="P10">
<rect x="3232.00" y="1091.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="3256.00" y="1118.00" font-size="17" font-weight="700" fill="#243031">P10</text>
<text x="3256.00" y="1149.50" font-size="20" font-weight="700" fill="#243031">精确十位 Packing 整网 T16</text>
<text x="3256.00" y="1185.50" font-size="16" font-weight="400" fill="#243031">Conv1/2 打包输出通道，Conv3 打包相</text>
