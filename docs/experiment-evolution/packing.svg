<text x="3256.00" y="1239.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 12.1563 ms / DSP 254</text>
<text x="3256.00" y="1269.50" font-size="15" font-weight="400" fill="#5c6160">超预算: LUT；HLS 时序警告</text>
</g>
<g data-id="P11">
<rect x="3033.00" y="1418.00" width="354" height="195" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="3057.00" y="1445.00" font-size="17" font-weight="700" fill="#243031">P11</text>
<text x="3057.00" y="1476.50" font-size="20" font-weight="700" fill="#243031">精确十位 Packing 整网 T8</text>
<text x="3057.00" y="1512.50" font-size="16" font-weight="400" fill="#243031">相同算术加大并行度。</text>
<text x="3057.00" y="1542.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 7.5772 ms / DSP 505</text>
<text x="3057.00" y="1572.50" font-size="15" font-weight="400" fill="#5c6160">超预算: LUT；HLS 时序警告</text>
</g>
