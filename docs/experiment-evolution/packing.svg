</g>
<g data-id="P13">
<rect x="3431.00" y="431.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="3455.00" y="458.00" font-size="17" font-weight="700" fill="#243031">P13</text>
<text x="3455.00" y="489.50" font-size="20" font-weight="700" fill="#243031">完整 INT16 双乘法控制</text>
<text x="3455.00" y="525.50" font-size="16" font-weight="400" fill="#243031">在相同输入/输出和吞吐率下直接计算两路</text>
<text x="3455.00" y="549.50" font-size="16" font-weight="400" fill="#243031"> signed16x16，作为新研究基线。</text>
<text x="3455.00" y="579.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 2 / LUT 57</text>
<text x="3455.00" y="609.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
