<text x="72.00" y="1455.50" font-size="20" font-weight="700" fill="#243031">Packing：省 DSP 的代价</text>
<text x="72.00" y="1491.50" font-size="17" font-weight="700" fill="#243031">INT8 与精确十位 PE 成立</text>
<text x="72.00" y="1517.00" font-size="17" font-weight="700" fill="#243031">P10-P12 整网 LUT 超预算</text>
<text x="72.00" y="1548.50" font-size="16" font-weight="400" fill="#5c6160">P13-P16：完整 INT16，仅准备记录</text>
</g>
<g data-id="scatter">
