<text x="470.00" y="1424.00" font-size="17" font-weight="700" fill="#243031">C / E050 / E060 / G01-G03</text>
<text x="470.00" y="1455.50" font-size="20" font-weight="700" fill="#243031">Conv3 Scatter</text>
<text x="470.00" y="1491.50" font-size="17" font-weight="700" fill="#243031">BRAM18K 168 → 137 → 87</text>
<text x="470.00" y="1517.00" font-size="17" font-weight="700" fill="#243031">29.83 → 37.70 → 44.14 ms</text>
<text x="470.00" y="1548.50" font-size="16" font-weight="400" fill="#5c6160">缓存变少，控制与额外工作变多</text>
</g>
<g data-id="memory">
<rect x="844.00" y="1397.00" width="354" height="194" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="868.00" y="1424.00" font-size="17" font-weight="700" fill="#243031">S01-S06</text>
<text x="868.00" y="1455.50" font-size="20" font-weight="700" fill="#243031">DDR 探针与分块融合</text>
<text x="868.00" y="1491.50" font-size="17" font-weight="700" fill="#243031">DDR 探针未导出 scratch 端口</text>
<text x="868.00" y="1517.00" font-size="17" font-weight="700" fill="#243031">B8-B64：少 BRAM、重算 halo</text>
<text x="868.00" y="1548.50" font-size="16" font-weight="400" fill="#5c6160">无有效 DDR；分块 LUT/时间不合格</text>
</g>
