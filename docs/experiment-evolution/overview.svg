<text x="982.50" y="527.00" font-size="17" font-weight="700" fill="#243031">E020-E029 / E032</text>
<text x="982.50" y="558.50" font-size="20" font-weight="700" fill="#243031">只改编译指令</text>
<text x="982.50" y="594.50" font-size="17" font-weight="700" fill="#243031">有效浮点控制约 3811 ms</text>
<text x="982.50" y="620.00" font-size="17" font-weight="700" fill="#243031">BRAM18K 11114</text>
<text x="982.50" y="651.50" font-size="16" font-weight="400" fill="#5c6160">修复无效配置后，仍需改存储组织</text>
</g>
<g data-id="streaming">
