<text x="773.50" y="1729.00" font-size="17" font-weight="700" fill="#243031">C01-C12 / 组合实验</text>
<text x="773.50" y="1760.50" font-size="20" font-weight="700" fill="#243031">Winograd + Packing / 混合</text>
<text x="773.50" y="1790.50" font-size="20" font-weight="700" fill="#243031">精度</text>
<text x="773.50" y="1826.50" font-size="17" font-weight="700" fill="#243031">最快原始估计 C11：1.0817 ms</text>
<text x="773.50" y="1852.00" font-size="17" font-weight="700" fill="#243031">LUT 248797 / FF 307525</text>
<text x="773.50" y="1883.50" font-size="16" font-weight="400" fill="#5c6160">明显超量，不能按最小时间选择</text>
</g>
<g data-id="loader">
