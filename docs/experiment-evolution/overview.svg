<text x="773.50" y="829.00" font-size="17" font-weight="700" fill="#243031">E030-E033 / E047-E048</text>
<text x="773.50" y="860.50" font-size="20" font-weight="700" fill="#243031">整网流连接与行缓存</text>
<text x="773.50" y="896.50" font-size="17" font-weight="700" fill="#243031">中间图取消，BRAM18K 168</text>
<text x="773.50" y="922.00" font-size="17" font-weight="700" fill="#243031">DSP 绑定、整数承载</text>
<text x="773.50" y="953.50" font-size="16" font-weight="400" fill="#5c6160">权重选择器仍大：LUT 89304</text>
</g>
