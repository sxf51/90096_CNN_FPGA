<text x="1067.00" y="1119.00" font-size="17" font-weight="700" fill="#243031">E034-E043 / E057-E067 扫描</text>
<text x="1067.00" y="1150.50" font-size="20" font-weight="700" fill="#243031">LUTRAM 银行、展开与时钟</text>
<text x="1067.00" y="1186.50" font-size="17" font-weight="700" fill="#243031">E043：HLS 约 6.9392 ms</text>
<text x="1067.00" y="1212.00" font-size="17" font-weight="700" fill="#243031">DSP 505 / BRAM18K 168</text>
<text x="1067.00" y="1243.50" font-size="16" font-weight="400" fill="#5c6160">资源合格；存在 HLS 时序告警</text>
