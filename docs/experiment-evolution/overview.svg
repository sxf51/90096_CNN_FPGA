<text x="1664.00" y="1424.00" font-size="17" font-weight="700" fill="#243031">B / F01-F15</text>
<text x="1664.00" y="1455.50" font-size="20" font-weight="700" fill="#243031">连续流水与固定窗口读取</text>
<text x="1664.00" y="1491.50" font-size="17" font-weight="700" fill="#243031">FIFO LUTRAM、在线补边</text>
<text x="1664.00" y="1517.00" font-size="17" font-weight="700" fill="#243031">双窗口流、通道轮换、注册加法树</text>
<text x="1664.00" y="1548.50" font-size="16" font-weight="400" fill="#5c6160">去像素间重启，减少宽选择器</text>
</g>
