<text x="1664.00" y="1744.00" font-size="17" font-weight="700" fill="#243031">F16-F24</text>
<text x="1664.00" y="1775.50" font-size="20" font-weight="700" fill="#243031">移除输出转换与加载路径瓶颈</text>
<text x="1664.00" y="1811.50" font-size="17" font-weight="700" fill="#243031">F20：精确 float 编码，0 DSP</text>
<text x="1664.00" y="1837.00" font-size="17" font-weight="700" fill="#243031">F24：显式三维权重加载索引</text>
