<text x="584.50" y="292.50" font-size="17" font-weight="700" fill="#243031">522.28 M MAC / frame</text>
<text x="584.50" y="318.00" font-size="17" font-weight="700" fill="#243031">BRAM18K 11064，器件仅 288</text>
