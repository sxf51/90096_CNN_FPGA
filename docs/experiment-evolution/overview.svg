<text x="1664.00" y="2116.50" font-size="17" font-weight="700" fill="#243031">HLS 约 2.64226 ms / DSP 502</text>
<text x="1664.00" y="2142.00" font-size="17" font-weight="700" fill="#243031">BRAM18K 73 / LUT 69976</text>
<text x="1664.00" y="2173.50" font-size="16" font-weight="400" fill="#5c6160">2.5 ns 有 uncertainty 后的时序告</text>
<text x="1664.00" y="2197.50" font-size="16" font-weight="400" fill="#5c6160">警</text>
</g>
