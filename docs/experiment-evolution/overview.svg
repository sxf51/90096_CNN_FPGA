<text x="82.00" y="1231.00" font-size="16" font-weight="400" fill="#5c6160">小内核成本不能当作整网结果</text>
</g>
<g data-id="packing">
<rect x="48.00" y="1397.00" width="354" height="194" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
