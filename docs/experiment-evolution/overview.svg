<text x="1266.00" y="1440.50" font-size="20" font-weight="700" fill="#243031">Winograd → 连续 tile → </text>
<text x="1266.00" y="1470.50" font-size="20" font-weight="700" fill="#243031">窄银行</text>
<text x="1266.00" y="1506.50" font-size="17" font-weight="700" fill="#243031">W18：HLS 约 4.2274 ms</text>
<text x="1266.00" y="1532.00" font-size="17" font-weight="700" fill="#243031">DSP 326 / LUT 74480</text>
<text x="1266.00" y="1563.50" font-size="16" font-weight="400" fill="#5c6160">资源合格；存在 HLS 时序告警</text>
</g>
<g data-id="continuous">
