<g data-id="W17">
<rect x="655.00" y="2642.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="679.00" y="2669.00" font-size="17" font-weight="700" fill="#243031">W17</text>
<text x="679.00" y="2700.50" font-size="20" font-weight="700" fill="#243031">T8 原始权重窄银行</text>
<text x="679.00" y="2736.50" font-size="16" font-weight="400" fill="#243031">原始权重只供顺序变换，减少其通道分银行</text>
<text x="679.00" y="2760.50" font-size="16" font-weight="400" fill="#243031">；保留变换后 MAC 银行。</text>
<text x="679.00" y="2790.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 2.1302 ms / DSP 648</text>
