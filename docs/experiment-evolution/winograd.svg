<svg xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" width="1853" height="2927" viewBox="0 0 1853 2927">
<title>D：Winograd，从精确变换到连续调度和权重银行</title>
<desc>乘法减少以后，变换、重排和宽位缓存是否成为更大的成本？。数据快照 800a87a。实验关系不是 Git 提交历史。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#778482"/></marker></defs>
<rect x="0" y="0" width="1853" height="2927" fill="#ffffff"/>
<text x="48" y="43" font-size="27" font-weight="700" fill="#182c2d">D：Winograd，从精确变换到连续调度和权重银行</text>
<text x="48" y="76" font-size="17" fill="#435654">乘法减少以后，变换、重排和宽位缓存是否成为更大的成本？</text>
<text x="48" y="105" font-size="16" fill="#526461">实线：基线、修复、集成；虚线：数值依据、对照、同一设计验证、复现。</text>
<text x="48" y="133" font-size="16" fill="#526461">绿：阶段证据通过；红：超预算或失败；琥珀：时序待处理；虚边：仅计划；灰：外部来源。</text>
