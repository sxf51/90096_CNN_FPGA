<text x="1077.00" y="2354.00" font-size="17" font-weight="700" fill="#243031">W14</text>
<text x="1077.00" y="2385.50" font-size="20" font-weight="700" fill="#243031">T8 双 4000 位窗口流</text>
<text x="1077.00" y="2421.50" font-size="16" font-weight="400" fill="#243031">把一个完整 Conv3 窗口分成同步的两个</text>
