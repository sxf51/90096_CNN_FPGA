<g data-id="W01">
<rect x="456.00" y="431.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="480.00" y="458.00" font-size="17" font-weight="700" fill="#243031">W01</text>
<text x="480.00" y="489.50" font-size="20" font-weight="700" fill="#243031">十位整数 F(2x2,3x3) PE</text>
<text x="480.00" y="525.50" font-size="16" font-weight="400" fill="#243031">用 G2=2G 保留整数变换，逆变换精确除</text>
<text x="480.00" y="549.50" font-size="16" font-weight="400" fill="#243031">以四再量化。</text>
<text x="480.00" y="579.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 16 / LUT 1499</text>
<text x="480.00" y="609.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
</g>
<g data-id="W02">
<rect x="48.00" y="746.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="72.00" y="773.00" font-size="17" font-weight="700" fill="#243031">W02</text>
<text x="72.00" y="804.50" font-size="20" font-weight="700" fill="#243031">直接卷积 PE 控制</text>
<text x="72.00" y="840.50" font-size="16" font-weight="400" fill="#243031">相同 tile 的直接 36 次乘法，比较 W</text>
<text x="72.00" y="864.50" font-size="16" font-weight="400" fill="#243031">inograd 的 16 次乘法。</text>
<text x="72.00" y="894.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 36 / LUT 503</text>
<text x="72.00" y="924.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
</g>
<g data-id="W03">
<rect x="446.00" y="746.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="470.00" y="773.00" font-size="17" font-weight="700" fill="#243031">W03</text>
<text x="470.00" y="804.50" font-size="20" font-weight="700" fill="#243031">十六位 Winograd PE</text>
<text x="470.00" y="840.50" font-size="16" font-weight="400" fill="#243031">增加输入/权重位宽，测量变换后的 18x2</text>
<text x="470.00" y="864.50" font-size="16" font-weight="400" fill="#243031">0 位乘法映射。</text>
<text x="470.00" y="894.50" font-size="16" font-weight="700" fill="#243031">PE: DSP 16 / LUT 2155</text>
<text x="470.00" y="924.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
</g>
<g data-id="W04">
<rect x="854.00" y="746.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="878.00" y="773.00" font-size="17" font-weight="700" fill="#243031">W04</text>
<text x="878.00" y="804.50" font-size="20" font-weight="700" fill="#243031">Winograd Conv1 单层 T16</text>
<text x="878.00" y="840.50" font-size="16" font-weight="400" fill="#243031">把 9x9 核拆为九个 3x3，运行时变换权</text>
<text x="878.00" y="864.50" font-size="16" font-weight="400" fill="#243031">重并重排 tile 输出。</text>
<text x="878.00" y="894.50" font-size="16" font-weight="700" fill="#243031">运行失败</text>
<text x="878.00" y="924.50" font-size="15" font-weight="400" fill="#5c6160">运行失败</text>
</g>
<g data-id="W05">
<rect x="550.50" y="1061.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="574.50" y="1088.00" font-size="17" font-weight="700" fill="#243031">W05</text>
<text x="574.50" y="1119.50" font-size="20" font-weight="700" fill="#243031">Winograd 整网 T16</text>
<text x="574.50" y="1155.50" font-size="16" font-weight="400" fill="#243031">把 Conv1 Winograd 与 Conv2/3 接</text>
<text x="574.50" y="1179.50" font-size="16" font-weight="400" fill="#243031">起来测整图。</text>
<text x="574.50" y="1209.50" font-size="16" font-weight="700" fill="#243031">运行失败</text>
<text x="574.50" y="1239.50" font-size="15" font-weight="400" fill="#5c6160">运行失败</text>
</g>
<g data-id="W06">
<rect x="351.50" y="1376.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="375.50" y="1403.00" font-size="17" font-weight="700" fill="#243031">W06</text>
<text x="375.50" y="1434.50" font-size="20" font-weight="700" fill="#243031">Winograd 整网 T8</text>
<text x="375.50" y="1470.50" font-size="16" font-weight="400" fill="#243031">改变并行度，在相同数值契约下测更快目标</text>
<text x="375.50" y="1494.50" font-size="16" font-weight="400" fill="#243031">。</text>
<text x="375.50" y="1524.50" font-size="16" font-weight="700" fill="#243031">运行失败</text>
<text x="375.50" y="1554.50" font-size="15" font-weight="400" fill="#5c6160">运行失败</text>
</g>
<g data-id="W07">
<rect x="1053.00" y="1061.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="1077.00" y="1088.00" font-size="17" font-weight="700" fill="#243031">W07</text>
<text x="1077.00" y="1119.50" font-size="20" font-weight="700" fill="#243031">单层头文件顺序修复</text>
<text x="1077.00" y="1155.50" font-size="16" font-weight="400" fill="#243031">先包含 AMD 类型头文件，再定义网络尺</text>
<text x="1077.00" y="1179.50" font-size="16" font-weight="400" fill="#243031">寸宏。</text>
<text x="1077.00" y="1209.50" font-size="16" font-weight="700" fill="#243031">单层: DSP 145 / LUT 30872</text>
<text x="1077.00" y="1239.50" font-size="15" font-weight="400" fill="#5c6160">候选，仍需验收</text>
</g>
<g data-id="W08">
<rect x="749.50" y="1388.00" width="354" height="195" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="773.50" y="1415.00" font-size="17" font-weight="700" fill="#243031">W08</text>
<text x="773.50" y="1446.50" font-size="20" font-weight="700" fill="#243031">整网 T16 头文件修复</text>
<text x="773.50" y="1482.50" font-size="16" font-weight="400" fill="#243031">在独立源码副本修复包含顺序。</text>
<text x="773.50" y="1512.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 22.8954 ms / DSP 326</text>
<text x="773.50" y="1542.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="W09">
<rect x="351.50" y="1718.00" width="354" height="195" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="375.50" y="1745.00" font-size="17" font-weight="700" fill="#243031">W09</text>
<text x="375.50" y="1776.50" font-size="20" font-weight="700" fill="#243031">整网 T8 头文件修复</text>
<text x="375.50" y="1812.50" font-size="16" font-weight="400" fill="#243031">相同修复下测 T8 并行度。</text>
<text x="375.50" y="1842.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 13.9743 ms / DSP 648</text>
<text x="375.50" y="1872.50" font-size="15" font-weight="400" fill="#5c6160">超预算: LUT；HLS 时序警告</text>
</g>
<g data-id="W10">
<rect x="1053.00" y="1691.00" width="354" height="249" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="1077.00" y="1718.00" font-size="17" font-weight="700" fill="#243031">W10</text>
<text x="1077.00" y="1749.50" font-size="20" font-weight="700" fill="#243031">固定 tile 循环，仅 Conv1 连</text>
<text x="1077.00" y="1779.50" font-size="20" font-weight="700" fill="#243031">续</text>
<text x="1077.00" y="1815.50" font-size="16" font-weight="400" fill="#243031">分离窗口生成与固定次数 MAC 循环，消</text>
<text x="1077.00" y="1839.50" font-size="16" font-weight="400" fill="#243031">除条件边界对循环估计的膨胀。</text>
<text x="1077.00" y="1869.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 7.5482 ms / DSP 326</text>
<text x="1077.00" y="1899.50" font-size="15" font-weight="400" fill="#5c6160">HLS 时序警告</text>
</g>
<g data-id="W11">
<rect x="854.00" y="2036.00" width="354" height="195" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="878.00" y="2063.00" font-size="17" font-weight="700" fill="#243031">W11</text>
<text x="878.00" y="2094.50" font-size="20" font-weight="700" fill="#243031">三层连续，T8，4 ns</text>
<text x="878.00" y="2130.50" font-size="16" font-weight="400" fill="#243031">推广连续调度到其他层，扫描 T8。</text>
<text x="878.00" y="2160.50" font-size="16" font-weight="700" fill="#243031">C 仿真 / 平均 ΔPSNR -0.0695 dB</text>
