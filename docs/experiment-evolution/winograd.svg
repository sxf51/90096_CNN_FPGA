</g>
<g data-id="W18">
<rect x="1451.00" y="2654.00" width="354" height="195" rx="4" fill="#fff7e8" stroke="#ac7b24" stroke-width="1.5"/>
<text x="1475.00" y="2681.00" font-size="17" font-weight="700" fill="#243031">W18</text>
