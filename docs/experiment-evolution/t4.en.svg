<text x="183.00" y="1385.50" font-size="20" font-weight="700" fill="#243031">T4 transformed-window FIFO</text>
<text x="183.00" y="1415.50" font-size="20" font-weight="700" fill="#243031">depth 32</text>
<text x="183.00" y="1451.50" font-size="16" font-weight="400" fill="#243031">Change only C13&apos;s</text>
<text x="183.00" y="1475.50" font-size="16" font-weight="400" fill="#243031">transformed-window FIFO from depth</text>
<text x="183.00" y="1499.50" font-size="16" font-weight="400" fill="#243031">2 to 32, retaining runtime</text>
<text x="183.00" y="1523.50" font-size="16" font-weight="400" fill="#243031">parameters and E065 mixed</text>
<text x="183.00" y="1547.50" font-size="16" font-weight="400" fill="#243031">precision.</text>
