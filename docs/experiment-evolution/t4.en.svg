<text x="48" y="81.5" font-size="17" font-weight="400" fill="#435654">Can moving packing into parameter loading meet numerical, RTL, and physical gates at T4?</text>
<text x="48" y="114" font-size="16" font-weight="400" fill="#526461">Solid: baseline, retry, integration. Dashed: references, controls, verification, reproduction.</text>
<text x="48" y="146" font-size="16" font-weight="400" fill="#526461">Green: stage evidence passed; red: over budget/failed; amber: timing pending; dashed border: plan; gray:</text>
<text x="48" y="170" font-size="16" font-weight="400" fill="#526461">external parent.</text>
