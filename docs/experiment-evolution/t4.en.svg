<g data-id="C13">
<rect x="280.00" y="517.00" width="420" height="321" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="304.00" y="544.00" font-size="17" font-weight="700" fill="#243031">C13</text>
<text x="304.00" y="575.50" font-size="20" font-weight="700" fill="#243031">T4 with runtime-prepacked</text>
<text x="304.00" y="605.50" font-size="20" font-weight="700" fill="#243031">Conv2 weights</text>
<text x="304.00" y="641.50" font-size="16" font-weight="400" fill="#243031">Use T=4, 8-bit weights and 21-bit</text>
<text x="304.00" y="665.50" font-size="16" font-weight="400" fill="#243031">accumulators only in Conv2,</text>
<text x="304.00" y="689.50" font-size="16" font-weight="400" fill="#243031">prepacking each coefficient pair</text>
<text x="304.00" y="713.50" font-size="16" font-weight="400" fill="#243031">into 27 bits during parameter</text>
<text x="304.00" y="737.50" font-size="16" font-weight="400" fill="#243031">loading and decoding each product.</text>
<text x="304.00" y="767.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 1.0524 ms / DSP 1032</text>
<text x="304.00" y="797.50" font-size="15" font-weight="400" fill="#5c6160">Over budget: LUT/FF</text>
</g>
<g data-id="C14">
<rect x="401.00" y="934.00" width="420" height="297" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="425.00" y="961.00" font-size="17" font-weight="700" fill="#243031">C14</text>
<text x="425.00" y="992.50" font-size="20" font-weight="700" fill="#243031">T4 two-frame RTL with</text>
<text x="425.00" y="1022.50" font-size="20" font-weight="700" fill="#243031">parameter reload</text>
<text x="425.00" y="1058.50" font-size="16" font-weight="400" fill="#243031">Freeze the mixed-precision</text>
<text x="425.00" y="1082.50" font-size="16" font-weight="400" fill="#243031">reference and check finite FIFOs,</text>
<text x="425.00" y="1106.50" font-size="16" font-weight="400" fill="#243031">deadlocks, and second-frame</text>
<text x="425.00" y="1130.50" font-size="16" font-weight="400" fill="#243031">parameter reload.</text>
<text x="425.00" y="1160.50" font-size="16" font-weight="700" fill="#243031">RTL Pass / 300632 cycles</text>
<text x="425.00" y="1190.50" font-size="15" font-weight="400" fill="#5c6160">RTL co-simulation complete</text>
</g>
<g data-id="C15">
<rect x="663.00" y="1363.00" width="420" height="273" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="687.00" y="1390.00" font-size="17" font-weight="700" fill="#243031">C15</text>
<text x="687.00" y="1421.50" font-size="20" font-weight="700" fill="#243031">First independent T4</text>
<text x="687.00" y="1451.50" font-size="20" font-weight="700" fill="#243031">implementation at 5 ns</text>
<text x="687.00" y="1487.50" font-size="16" font-weight="400" fill="#243031">Validate C13 under routed gates</text>
<text x="687.00" y="1511.50" font-size="16" font-weight="400" fill="#243031">with unchanged RTL, target, and</text>
<text x="687.00" y="1535.50" font-size="16" font-weight="400" fill="#243031">numerical acceptance.</text>
<text x="687.00" y="1565.50" font-size="16" font-weight="700" fill="#243031">Physical implementation incomplete</text>
<text x="687.00" y="1595.50" font-size="15" font-weight="400" fill="#5c6160">Host memory guard stopped the job</text>
</g>
<g data-id="C18">
<rect x="411.00" y="1768.00" width="420" height="345" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="435.00" y="1795.00" font-size="17" font-weight="700" fill="#243031">C18</text>
<text x="435.00" y="1826.50" font-size="20" font-weight="700" fill="#243031">T4 5 ns retry with staged</text>
<text x="435.00" y="1856.50" font-size="20" font-weight="700" fill="#243031">processes</text>
<text x="435.00" y="1892.50" font-size="16" font-weight="400" fill="#243031">Complete synthesis/report in one</text>
<text x="435.00" y="1916.50" font-size="16" font-weight="400" fill="#243031">Vivado process, exit it, then</text>
<text x="435.00" y="1940.50" font-size="16" font-weight="400" fill="#243031">reopen the same C13 project in a</text>
<text x="435.00" y="1964.50" font-size="16" font-weight="400" fill="#243031">fresh implementation process.</text>
<text x="435.00" y="1988.50" font-size="16" font-weight="400" fill="#243031">Preserve target, threads, and</text>
<text x="435.00" y="2012.50" font-size="16" font-weight="400" fill="#243031">cumulative timeout.</text>
<text x="435.00" y="2042.50" font-size="16" font-weight="700" fill="#243031">Routed WNS 0.047 ns</text>
<text x="435.00" y="2072.50" font-size="15" font-weight="400" fill="#5c6160">Independent route gates pass</text>
</g>
