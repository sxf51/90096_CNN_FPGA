<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1250" height="1540" viewBox="0 0 1250 1540">
<title>C: gather/scatter storage and control tradeoffs</title>
<desc>How much BRAM can channel reduction before buffering save, and what does it cost?. Snapshot a3d78b7. Experiment relationships are not Git ancestry.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#778482"/></marker></defs>
<rect x="0" y="0" width="1250" height="1540" fill="#ffffff"/>
<text x="48" y="43" font-size="27" font-weight="700" fill="#182c2d">C: gather/scatter storage and control tradeoffs</text>
<text x="48" y="81.5" font-size="17" font-weight="400" fill="#435654">How much BRAM can channel reduction before buffering save, and what does it cost?</text>
<text x="48" y="114" font-size="16" font-weight="400" fill="#526461">Solid: baseline, retry, integration. Dashed: references, controls, verification, reproduction.</text>
<text x="48" y="146" font-size="16" font-weight="400" fill="#526461">Green: stage evidence passed; red: over budget/failed; amber: timing pending; dashed border: plan; gray:</text>
<text x="48" y="170" font-size="16" font-weight="400" fill="#526461">external parent.</text>
<path d="M722.00 397.00 L722.00 445.00 L722.00 493.00" fill="none" stroke="#778482" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M258.00 683.00 L258.00 784.00 L318.36 784.00 L318.36 832.00" fill="none" stroke="#778482" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M722.00 736.00 L722.00 784.00 L661.64 784.00 L661.64 832.00" fill="none" stroke="#778482" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M490.00 1105.00 L490.00 1153.00 L490.00 1201.00" fill="none" stroke="#778482" stroke-width="1.7" marker-end="url(#arrow)"/>
<g data-id="G01">
<rect x="512.00" y="493.00" width="420" height="243" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="536.00" y="520.00" font-size="17" font-weight="700" fill="#243031">G01</text>
<text x="536.00" y="551.50" font-size="20" font-weight="700" fill="#243031">Matched gather control</text>
<text x="536.00" y="587.50" font-size="16" font-weight="400" fill="#243031">Independently rerun the same T32,</text>
<text x="536.00" y="611.50" font-size="16" font-weight="400" fill="#243031">10 ns, 10-bit Conv3 line-buffer</text>
<text x="536.00" y="635.50" font-size="16" font-weight="400" fill="#243031">organization.</text>
<text x="536.00" y="665.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 29.8302 ms / DSP 254</text>
<text x="536.00" y="695.50" font-size="15" font-weight="400" fill="#5c6160">Candidate; final acceptance pending</text>
</g>
<g data-id="G02">
<rect x="280.00" y="832.00" width="420" height="273" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="304.00" y="859.00" font-size="17" font-weight="700" fill="#243031">G02</text>
<text x="304.00" y="890.50" font-size="20" font-weight="700" fill="#243031">Scatter with explicit</text>
<text x="304.00" y="920.50" font-size="20" font-weight="700" fill="#243031">padding</text>
<text x="304.00" y="956.50" font-size="16" font-weight="400" fill="#243031">Store five rows of 32-bit partial</text>
<text x="304.00" y="980.50" font-size="16" font-weight="400" fill="#243031">sums while retaining 32-channel</text>
<text x="304.00" y="1004.50" font-size="16" font-weight="400" fill="#243031">padding.</text>
<text x="304.00" y="1034.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 37.7021 ms / DSP 254</text>
<text x="304.00" y="1064.50" font-size="15" font-weight="400" fill="#5c6160">Candidate; final acceptance pending</text>
</g>
<g data-id="G03">
<rect x="280.00" y="1201.00" width="420" height="273" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="304.00" y="1228.00" font-size="17" font-weight="700" fill="#243031">G03</text>
<text x="304.00" y="1259.50" font-size="20" font-weight="700" fill="#243031">Scatter with merged boundary</text>
<text x="304.00" y="1289.50" font-size="20" font-weight="700" fill="#243031">kernels</text>
<text x="304.00" y="1325.50" font-size="16" font-weight="400" fill="#243031">Merge repeated taps for nine</text>
<text x="304.00" y="1349.50" font-size="16" font-weight="400" fill="#243031">boundary classes and remove the</text>
<text x="304.00" y="1373.50" font-size="16" font-weight="400" fill="#243031">wide-channel padding buffer.</text>
<text x="304.00" y="1403.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 44.1393 ms / DSP 254</text>
<text x="304.00" y="1433.50" font-size="15" font-weight="400" fill="#5c6160">Candidate; final acceptance pending</text>
</g>
