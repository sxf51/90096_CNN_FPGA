<text x="48" y="43" font-size="27" font-weight="700" fill="#182c2d">T4：运行时预拼 Conv2 参数与独立布线</text>
<text x="48" y="76" font-size="17" fill="#435654">将 Packing 移到加载阶段后，T4 能否通过数值、RTL 和物理门限？</text>
<text x="48" y="105" font-size="16" fill="#526461">实线：基线、修复、集成；虚线：数值依据、对照、同一设计验证、复现。</text>
<text x="48" y="133" font-size="16" fill="#526461">绿：阶段证据通过；红：超预算或失败；琥珀：时序待处理；虚边：仅计划；灰：外部来源。</text>
