<text x="536.00" y="1022.00" font-size="16" font-weight="700" fill="#243031">HLS estimate 228.0354 ms / DSP 296</text>
<text x="536.00" y="1052.00" font-size="15" font-weight="400" fill="#5c6160">Over budget: LUT</text>
