<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1444" height="1539" viewBox="0 0 1444 1539">
<title>Storage routes: dataflow, DDR probe, and fused tiles</title>
<desc>Can external memory or small tiles replace full maps while preserving boundary behavior?. Snapshot 800a87a. Experiment relationships are not Git ancestry.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#778482"/></marker></defs>
