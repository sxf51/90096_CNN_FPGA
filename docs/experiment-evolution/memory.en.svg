<rect x="48.00" y="808.00" width="420" height="296" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="72.00" y="835.00" font-size="17" font-weight="700" fill="#243031">S01</text>
<text x="72.00" y="866.50" font-size="20" font-weight="700" fill="#243031">Global-array DDR interface</text>
<text x="72.00" y="896.50" font-size="20" font-weight="700" fill="#243031">probe</text>
<text x="72.00" y="932.50" font-size="16" font-weight="400" fill="#243031">Attempt to export AXI ports for</text>
<text x="72.00" y="956.50" font-size="16" font-weight="400" fill="#243031">global scratch arrays and examine</text>
<text x="72.00" y="980.50" font-size="16" font-weight="400" fill="#243031">layer-to-layer external storage.</text>
<text x="72.00" y="1010.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 167.3047 ms / DSP 254</text>
<text x="72.00" y="1040.50" font-size="15" font-weight="400" fill="#5c6160">Over budget: BRAM18K; Invalid</text>
<text x="72.00" y="1063.00" font-size="15" font-weight="400" fill="#5c6160">configuration</text>
</g>
