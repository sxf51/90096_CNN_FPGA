<g data-id="F35">
<rect x="436.00" y="431.00" width="354" height="219" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="460.00" y="458.00" font-size="17" font-weight="700" fill="#243031">F35</text>
<text x="460.00" y="489.50" font-size="20" font-weight="700" fill="#243031">运行时权重银行与 ROM 等价</text>
<text x="460.00" y="525.50" font-size="16" font-weight="400" fill="#243031">导出运行时加载后的整数银行，逐元素与同</text>
<text x="460.00" y="549.50" font-size="16" font-weight="400" fill="#243031">量化、同 G2 变换的 ROM 内容比较。</text>
<text x="460.00" y="579.50" font-size="16" font-weight="700" fill="#243031">C 仿真 / 平均 ΔPSNR -0.0695 dB</text>
<text x="460.00" y="609.50" font-size="15" font-weight="400" fill="#5c6160">C 仿真通过</text>
</g>
<g data-id="W24">
<rect x="247.00" y="746.00" width="354" height="243" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="271.00" y="773.00" font-size="17" font-weight="700" fill="#243031">W24</text>
<text x="271.00" y="804.50" font-size="20" font-weight="700" fill="#243031">T8 常量 ROM 整网</text>
<text x="271.00" y="840.50" font-size="16" font-weight="400" fill="#243031">新顶层 srcnn_rom 固定训练参数，移除</text>
<text x="271.00" y="864.50" font-size="16" font-weight="400" fill="#243031">参数 AXI、读取/变换进程和私有银行写</text>
<text x="271.00" y="888.50" font-size="16" font-weight="400" fill="#243031">端口。</text>
<text x="271.00" y="918.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 1.746 ms / DSP 630</text>
<text x="271.00" y="948.50" font-size="15" font-weight="400" fill="#5c6160">局部实验通过</text>
</g>
<g data-id="W25">
<rect x="247.00" y="1085.00" width="354" height="243" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="271.00" y="1112.00" font-size="17" font-weight="700" fill="#243031">W25</text>
<text x="271.00" y="1143.50" font-size="20" font-weight="700" fill="#243031">ROM 换输入双帧 RTL</text>
<text x="271.00" y="1179.50" font-size="16" font-weight="400" fill="#243031">使用相同 ROM 权重，第二帧改为 lenna</text>
<text x="271.00" y="1203.50" font-size="16" font-weight="400" fill="#243031">；保留有限 FIFO、死锁和逐位输出检查</text>
<text x="271.00" y="1227.50" font-size="16" font-weight="400" fill="#243031">。</text>
<text x="271.00" y="1257.50" font-size="16" font-weight="700" fill="#243031">RTL Pass / 554226 cycles</text>
<text x="271.00" y="1287.50" font-size="15" font-weight="400" fill="#5c6160">RTL 协仿完成</text>
</g>
<g data-id="W29">
<rect x="466.00" y="1424.00" width="354" height="219" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="490.00" y="1451.00" font-size="17" font-weight="700" fill="#243031">W29</text>
<text x="490.00" y="1482.50" font-size="20" font-weight="700" fill="#243031">ROM 首次 5 ns 实现</text>
<text x="490.00" y="1518.50" font-size="16" font-weight="400" fill="#243031">在独立工作区验证 ROM 的物理时序和资</text>
<text x="490.00" y="1542.50" font-size="16" font-weight="400" fill="#243031">源，不用 HLS 时钟推断实现结果。</text>
<text x="490.00" y="1572.50" font-size="16" font-weight="700" fill="#243031">物理实现未完成</text>
<text x="490.00" y="1602.50" font-size="15" font-weight="400" fill="#5c6160">主机内存保护中止</text>
</g>
<g data-id="W31">
<rect x="247.00" y="1739.00" width="354" height="219" rx="4" fill="#ffffff" stroke="#939b9b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="271.00" y="1766.00" font-size="17" font-weight="700" fill="#243031">W31</text>
<text x="271.00" y="1797.50" font-size="20" font-weight="700" fill="#243031">ROM 内存失败后独立重试</text>
<text x="271.00" y="1833.50" font-size="16" font-weight="400" fill="#243031">同一 ROM RTL 在新工作区补跑，沿用原</text>
<text x="271.00" y="1857.50" font-size="16" font-weight="400" fill="#243031">数值、时序和资源门限。</text>
<text x="271.00" y="1887.50" font-size="16" font-weight="700" fill="#243031">已排队/运行，暂无归档测量</text>
<text x="271.00" y="1917.50" font-size="15" font-weight="400" fill="#5c6160">未归档测量</text>
</g>
