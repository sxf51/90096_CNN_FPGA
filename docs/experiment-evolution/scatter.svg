<text x="72.00" y="530.50" font-size="20" font-weight="700" fill="#243031">整数版 Conv3 Scatter</text>
<text x="72.00" y="566.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 37.7021 ms / DSP 254</text>
