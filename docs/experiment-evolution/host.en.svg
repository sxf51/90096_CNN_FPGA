<text x="48" y="81.5" font-size="17" font-weight="400" fill="#435654">Can unchanged hardware jobs overlap safely, and do measured peaks fit their registrations?</text>
<text x="48" y="114" font-size="16" font-weight="400" fill="#526461">Solid: baseline, retry, integration. Dashed: references, controls, verification, reproduction.</text>
<text x="48" y="146" font-size="16" font-weight="400" fill="#526461">Green: stage evidence passed; red: over budget/failed; amber: timing pending; dashed border: plan; gray: external parent.</text>
