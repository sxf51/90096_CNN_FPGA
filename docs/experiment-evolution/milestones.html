  <script>
    const graph = JSON.parse(document.getElementById('graph-data').textContent);
    const english = document.documentElement.lang === 'en';
    const milestones = graph.key === 'milestones';
    const text = english ? {
      metric: '100 MHz reference / ms per image',
      pass: 'Stage passes + network estimate', auxiliary: 'Auxiliary; no network latency', timing: 'HLS timing warning',
      failure: 'Problem shown; time not bold', analysis: 'Software analysis', faded: 'Failed / unrun',
      query: 'Experiment ID', out: 'Zoom out', in: 'Zoom in', fit: 'Fit complete graph', clear: 'Clear selection',
      download: 'Download SVG', missing: 'Experiment not found'
    } : {
      metric: '100 MHz 参考 / ms/张',
      pass: '阶段通过 + 整网估算', auxiliary: '辅助实验，无整网耗时', timing: 'HLS 时序告警',
      failure: '注明问题，耗时不加粗', analysis: '软件分析', faded: '失败 / 未运行',
      query: '实验编号', out: '缩小', in: '放大', fit: '显示全图', clear: '清除定位',
      download: '下载 SVG', missing: '没有该实验记录'
    };
    if (milestones) Object.assign(text, english ? {
      metric: 'HLS estimates / routed-target compute times', pass: 'Stage evidence passes',
      query: 'Experiment ID', missing: 'Milestone not found'
    } : {
      metric: 'HLS 估计 / 布线目标下折算耗时', pass: '阶段证据通过',
      query: '实验编号', missing: '没有对应里程碑'
    });
    for (const element of document.querySelectorAll('[data-text]')) {
      if (milestones && ['auxiliary', 'faded'].includes(element.dataset.text)) element.parentElement.hidden = true;
      element.textContent = text[element.dataset.text];
    }
    for (const id of ['out', 'in', 'fit', 'clear', 'download']) {
      document.getElementById(id).title = text[id];
      document.getElementById(id).setAttribute('aria-label', text[id]);
    }
    const query = document.getElementById('query');
    query.placeholder = text.query;
    query.setAttribute('aria-label', text.query);
    text.summary = graph.nodes.length + (milestones ? english ? ' milestones / ' : ' 个里程碑 / '
      : english ? ' experiments / ' : ' 项实验 / ') + graph.edges.length
      + (english ? ' main links / snapshot ' : ' 条主要连线 / 快照 ') + graph.source_commit;
    document.querySelector('.counts').textContent = graph.nodes.length + ' / ' + graph.edges.length;
    const nodes = new Map(graph.nodes.map(node => [node.id, node]));
    const aliases = new Map(graph.nodes.flatMap(node => (node.aliases || []).map(id => [id, node.id])));
    for (const id of new Set([...nodes.keys(), ...aliases.keys()])) {
      const option = document.createElement('option');
      option.value = id;
      document.getElementById('ids').append(option);
    }
    const viewport = document.getElementById('viewport');
    const scene = document.getElementById('scene');
    const status = document.getElementById('status');
    let scale = 1, x = 0, y = 0, selected = null, moved = false, pressStart;
    const pointers = new Map();
    const update = () => {
      scene.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      document.getElementById('zoom').textContent = Math.round(scale * 100) + '%';
    };
    const point = event => {
      const bounds = viewport.getBoundingClientRect();
      return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
    };
    const zoomAt = (next, pivot) => {
      next = Math.max(0.02, Math.min(4, next));
      const ratio = next / scale;
      x = pivot.x - (pivot.x - x) * ratio;
      y = pivot.y - (pivot.y - y) * ratio;
      scale = next;
      update();
    };
    const center = () => ({ x: viewport.clientWidth / 2, y: viewport.clientHeight / 2 });
    const fit = () => {
      scale = Math.min((viewport.clientWidth - 28) / graph.width, (viewport.clientHeight - 28) / graph.height);
      x = (viewport.clientWidth - graph.width * scale) / 2;
      y = (viewport.clientHeight - graph.height * scale) / 2;
      update();
    };
    const walk = (id, reverse) => {
      const visited = new Set([id]), queue = [id];
      for (let i = 0; i < queue.length; i++) for (const edge of graph.edges) {
        const from = reverse ? edge.to : edge.from, to = reverse ? edge.from : edge.to;
        if (from === queue[i] && !visited.has(to)) { visited.add(to); queue.push(to); }
      }
      return visited;
    };
    const choose = (id, recenter = true) => {
      if (id && !nodes.has(id)) id = aliases.get(id) || id;
      const node = nodes.get(id);
      if (id && !node) { query.setAttribute('aria-invalid', 'true'); status.textContent = text.missing; return; }
      selected = id || null;
      query.removeAttribute('aria-invalid');
      query.value = id || '';
      const related = id ? new Set([...walk(id, true), ...walk(id, false)]) : new Set(nodes.keys());
      for (const group of scene.querySelectorAll('[data-id]')) {
        group.classList.toggle('unrelated', !related.has(group.dataset.id));
        group.classList.toggle('selected', group.dataset.id === id);
      }
      for (const edge of scene.querySelectorAll('[data-from]')) {
        const relevant = related.has(edge.dataset.from) && related.has(edge.dataset.to);
        edge.classList.toggle('unrelated', !relevant);
        edge.classList.toggle('related-edge', !!id && relevant);
      }
      status.textContent = node ? node.id + ' / ' + node.texts.slice(1).map(row => row.text).join(' / ')
        + (node.metric ? ' / ' + node.metric.source.toUpperCase() : '') : text.summary;
      if (node && recenter) {
        scale = Math.min(1, (viewport.clientWidth - 40) / node.width);
        x = viewport.clientWidth / 2 - (node.x + node.width / 2) * scale;
        y = viewport.clientHeight / 2 - (node.y + node.height / 2) * scale;
        update();
      } else if (recenter) fit();
    };
    document.getElementById('find').addEventListener('submit', event => { event.preventDefault(); choose(query.value.trim().toUpperCase()); });
    query.addEventListener('change', () => choose(query.value.trim().toUpperCase()));
    document.getElementById('in').onclick = () => zoomAt(scale * 1.4, center());
    document.getElementById('out').onclick = () => zoomAt(scale / 1.4, center());
    document.getElementById('fit').onclick = () => choose(null);
    document.getElementById('clear').onclick = () => choose(null, false);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') choose(null, false); });
    viewport.addEventListener('wheel', event => { event.preventDefault(); zoomAt(scale * Math.exp(-event.deltaY * 0.002), point(event)); }, { passive: false });
    viewport.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      if (!pointers.size) { pressStart = point(event); moved = false; }
      else moved = true;
      pointers.set(event.pointerId, point(event));
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      const before = [...pointers.values()], previous = pointers.get(event.pointerId), current = point(event);
      pointers.set(event.pointerId, current);
      const after = [...pointers.values()];
      if (pointers.size === 2) {
        const distance = pair => Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y);
        const midpoint = pair => ({ x: (pair[0].x + pair[1].x) / 2, y: (pair[0].y + pair[1].y) / 2 });
        const start = midpoint(before), end = midpoint(after);
        if (distance(before) > 0) zoomAt(scale * distance(after) / distance(before), start);
        x += end.x - start.x; y += end.y - start.y; moved = true;
      } else {
        const dx = current.x - previous.x, dy = current.y - previous.y;
        if (Math.hypot(current.x - pressStart.x, current.y - pressStart.y) > 4) moved = true;
        x += dx; y += dy;
      }
      update();
    });
    const release = event => {
      if (!pointers.has(event.pointerId)) return;
      if (!moved && pointers.size === 1 && event.type !== 'pointercancel') {
        const group = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-id]');
        if (group && scene.contains(group)) choose(group.dataset.id);
      }
      pointers.delete(event.pointerId);
      if (!pointers.size) viewport.classList.remove('dragging');
    };
    viewport.addEventListener('pointerup', release);
    viewport.addEventListener('pointercancel', release);
    new ResizeObserver(() => selected ? choose(selected) : fit()).observe(viewport);
    choose(milestones ? graph.nodes[0].id : null);
  </script>
