<text x="72.00" y="834.50" font-size="20" font-weight="700" fill="#243031">Winograd + 仅 Conv3 Pack</text>
<text x="72.00" y="864.50" font-size="20" font-weight="700" fill="#243031">ing，T4</text>
<text x="72.00" y="900.50" font-size="16" font-weight="400" fill="#243031">保留直接 Conv2，隔离 Conv2 Packin</text>
<text x="72.00" y="924.50" font-size="16" font-weight="400" fill="#243031">g 的代价。</text>
<text x="72.00" y="954.50" font-size="16" font-weight="700" fill="#243031">运行失败</text>
<text x="72.00" y="984.50" font-size="15" font-weight="400" fill="#5c6160">运行失败</text>
