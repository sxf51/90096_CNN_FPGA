<text x="470.00" y="458.00" font-size="17" font-weight="700" fill="#243031">C01</text>
<text x="470.00" y="489.50" font-size="20" font-weight="700" fill="#243031">Winograd + Conv2/3 Packi</text>
<text x="470.00" y="519.50" font-size="20" font-weight="700" fill="#243031">ng，T4</text>
<text x="470.00" y="555.50" font-size="16" font-weight="400" fill="#243031">组合 Conv1 Winograd 和后两层精确十</text>
<text x="470.00" y="579.50" font-size="16" font-weight="400" fill="#243031">位 Packing。</text>
