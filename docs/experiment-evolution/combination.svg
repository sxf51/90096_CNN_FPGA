<text x="868.00" y="830.00" font-size="17" font-weight="700" fill="#243031">C04</text>
<text x="868.00" y="861.50" font-size="20" font-weight="700" fill="#243031">双层 Packing 头文件修复</text>
<text x="868.00" y="897.50" font-size="16" font-weight="400" fill="#243031">只修复包含顺序，保持数学、精度和参数。</text>
<text x="868.00" y="927.50" font-size="16" font-weight="700" fill="#243031">HLS 估计 9.5138 ms / DSP 936</text>
<text x="868.00" y="957.50" font-size="15" font-weight="400" fill="#5c6160">超预算: LUT/FF；HLS 时序警告</text>
