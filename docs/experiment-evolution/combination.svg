<text x="470.00" y="815.00" font-size="17" font-weight="700" fill="#243031">C03</text>
<text x="470.00" y="846.50" font-size="20" font-weight="700" fill="#243031">Winograd + Conv2/3 Packi</text>
<text x="470.00" y="876.50" font-size="20" font-weight="700" fill="#243031">ng，T8</text>
<text x="470.00" y="912.50" font-size="16" font-weight="400" fill="#243031">降低并行度以控制资源。</text>
