<text x="48" y="43" font-size="27" font-weight="700" fill="#182c2d">组合路线：Winograd 与 Packing 能否叠加收益</text>
<text x="48" y="76" font-size="17" fill="#435654">局部节省乘法之后，是否还有足够 LUT、FF 和缓存支持整网？</text>
<text x="48" y="105" font-size="16" fill="#526461">实线：基线、修复、集成；虚线：数值依据、对照、同一设计验证、复现。</text>
<text x="48" y="133" font-size="16" fill="#526461">绿：阶段证据通过；红：超预算或失败；琥珀：时序待处理；虚边：仅计划；灰：外部来源。</text>
