<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1250" height="2476" viewBox="0 0 1250 2476">
<title>Constant ROM: measure the parameter-path cost</title>
<desc>How many resources and cycles can fixed weights save, and is losing runtime parameters worthwhile?. Snapshot 653ceb9. Experiment relationships are not Git ancestry.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#778482"/></marker></defs>
<rect x="0" y="0" width="1250" height="2476" fill="#ffffff"/>
<text x="48" y="43" font-size="27" font-weight="700" fill="#182c2d">Constant ROM: measure the parameter-path cost</text>
<text x="48" y="81.5" font-size="17" font-weight="400" fill="#435654">How many resources and cycles can fixed weights save, and is losing runtime parameters worthwhile?</text>
<text x="48" y="114" font-size="16" font-weight="400" fill="#526461">Solid: baseline, retry, integration. Dashed: references, controls, verification, reproduction.</text>
<text x="48" y="146" font-size="16" font-weight="400" fill="#526461">Green: stage evidence passed; red: over budget/failed; amber: timing pending; dashed border: plan; gray:</text>
<text x="48" y="170" font-size="16" font-weight="400" fill="#526461">external parent.</text>
