<g data-id="F35">
<rect x="502.00" y="493.00" width="420" height="321" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="526.00" y="520.00" font-size="17" font-weight="700" fill="#243031">F35</text>
<text x="526.00" y="551.50" font-size="20" font-weight="700" fill="#243031">Runtime-bank and ROM</text>
<text x="526.00" y="581.50" font-size="20" font-weight="700" fill="#243031">equivalence</text>
<text x="526.00" y="617.50" font-size="16" font-weight="400" fill="#243031">Export loaded integer banks and</text>
<text x="526.00" y="641.50" font-size="16" font-weight="400" fill="#243031">compare every element with ROM</text>
<text x="526.00" y="665.50" font-size="16" font-weight="400" fill="#243031">using identical quantization and G2</text>
<text x="526.00" y="689.50" font-size="16" font-weight="400" fill="#243031">transforms.</text>
<text x="526.00" y="719.50" font-size="16" font-weight="700" fill="#243031">C simulation / avg delta PSNR</text>
<text x="526.00" y="743.50" font-size="16" font-weight="700" fill="#243031">-0.0695 dB</text>
<text x="526.00" y="773.50" font-size="15" font-weight="400" fill="#5c6160">C simulation passed</text>
</g>
<g data-id="W24">
<rect x="280.00" y="910.00" width="420" height="321" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="304.00" y="937.00" font-size="17" font-weight="700" fill="#243031">W24</text>
<text x="304.00" y="968.50" font-size="20" font-weight="700" fill="#243031">T8 network with constant ROM</text>
<text x="304.00" y="998.50" font-size="20" font-weight="700" fill="#243031">weights</text>
<text x="304.00" y="1034.50" font-size="16" font-weight="400" fill="#243031">Introduce srcnn_rom with fixed</text>
<text x="304.00" y="1058.50" font-size="16" font-weight="400" fill="#243031">training parameters, removing</text>
<text x="304.00" y="1082.50" font-size="16" font-weight="400" fill="#243031">parameter AXI, reader/transformer</text>
<text x="304.00" y="1106.50" font-size="16" font-weight="400" fill="#243031">processes, and private-bank write</text>
<text x="304.00" y="1130.50" font-size="16" font-weight="400" fill="#243031">ports.</text>
<text x="304.00" y="1160.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 1.746 ms / DSP 630</text>
<text x="304.00" y="1190.50" font-size="15" font-weight="400" fill="#5c6160">Local experiment passed</text>
</g>
<g data-id="W25">
<rect x="280.00" y="1327.00" width="420" height="297" rx="4" fill="#f0f8f3" stroke="#458365" stroke-width="1.5"/>
<text x="304.00" y="1354.00" font-size="17" font-weight="700" fill="#243031">W25</text>
<text x="304.00" y="1385.50" font-size="20" font-weight="700" fill="#243031">ROM two-frame RTL with</text>
<text x="304.00" y="1415.50" font-size="20" font-weight="700" fill="#243031">changed input</text>
<text x="304.00" y="1451.50" font-size="16" font-weight="400" fill="#243031">Keep ROM weights identical and use</text>
<text x="304.00" y="1475.50" font-size="16" font-weight="400" fill="#243031">lenna for the second frame,</text>
<text x="304.00" y="1499.50" font-size="16" font-weight="400" fill="#243031">retaining finite-FIFO, deadlock,</text>
<text x="304.00" y="1523.50" font-size="16" font-weight="400" fill="#243031">and bit-exact checks.</text>
<text x="304.00" y="1553.50" font-size="16" font-weight="700" fill="#243031">RTL Pass / 554226 cycles</text>
<text x="304.00" y="1583.50" font-size="15" font-weight="400" fill="#5c6160">RTL co-simulation complete</text>
</g>
<g data-id="W29">
<rect x="532.00" y="1720.00" width="420" height="273" rx="4" fill="#fcf0f0" stroke="#b16868" stroke-width="1.5"/>
<text x="556.00" y="1747.00" font-size="17" font-weight="700" fill="#243031">W29</text>
<text x="556.00" y="1778.50" font-size="20" font-weight="700" fill="#243031">First ROM implementation at</text>
<text x="556.00" y="1808.50" font-size="20" font-weight="700" fill="#243031">5 ns</text>
<text x="556.00" y="1844.50" font-size="16" font-weight="400" fill="#243031">Independently measure ROM</text>
<text x="556.00" y="1868.50" font-size="16" font-weight="400" fill="#243031">timing/resources without inferring</text>
<text x="556.00" y="1892.50" font-size="16" font-weight="400" fill="#243031">implementation from HLS clocks.</text>
<text x="556.00" y="1922.50" font-size="16" font-weight="700" fill="#243031">Physical implementation incomplete</text>
<text x="556.00" y="1952.50" font-size="15" font-weight="400" fill="#5c6160">Host memory guard stopped the job</text>
</g>
<g data-id="W31">
<rect x="280.00" y="2089.00" width="420" height="321" rx="4" fill="#ffffff" stroke="#939b9b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="304.00" y="2116.00" font-size="17" font-weight="700" fill="#243031">W31</text>
<text x="304.00" y="2147.50" font-size="20" font-weight="700" fill="#243031">Independent ROM retry after</text>
<text x="304.00" y="2177.50" font-size="20" font-weight="700" fill="#243031">memory failure</text>
<text x="304.00" y="2213.50" font-size="16" font-weight="400" fill="#243031">Retry identical ROM RTL in a fresh</text>
<text x="304.00" y="2237.50" font-size="16" font-weight="400" fill="#243031">workspace with the original</text>
<text x="304.00" y="2261.50" font-size="16" font-weight="400" fill="#243031">numerical, timing, and resource</text>
<text x="304.00" y="2285.50" font-size="16" font-weight="400" fill="#243031">gates.</text>
<text x="304.00" y="2315.50" font-size="16" font-weight="700" fill="#243031">Queued/running; no archived</text>
<text x="304.00" y="2339.50" font-size="16" font-weight="700" fill="#243031">measurements</text>
<text x="304.00" y="2369.50" font-size="15" font-weight="400" fill="#5c6160">No archived measurements</text>
</g>
<g data-id="W19">
<rect x="512.00" y="230.00" width="420" height="167" rx="4" fill="#f4f5f5" stroke="#b7bfbf" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="536.00" y="257.00" font-size="17" font-weight="700" fill="#243031">W19 / external parent</text>
<text x="536.00" y="288.50" font-size="20" font-weight="700" fill="#243031">Private parameter streams</text>
<text x="536.00" y="318.50" font-size="20" font-weight="700" fill="#243031">for Winograd T8</text>
<text x="536.00" y="354.50" font-size="16" font-weight="700" fill="#243031">HLS estimate 1.749 ms / DSP 645</text>
</g>
