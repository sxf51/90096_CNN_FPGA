<text x="584.0" y="528.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" opacity="1.0">Weights 32 x 25 x 10 b = 8,000 b in LUTRAM, partitioned 8 x 25 so all 200 taps are read in one cycle.</text>
